[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openwear-coach"
version = "0.1.0"
description = "Local-first strength and recovery MCP server for user-owned wearable data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.0,<3",
]

[project.scripts]
openwear-coach = "openwear_coach.server:main"

[tool.setuptools.packages.find]
where = ["src"]
